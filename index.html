<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research: AI in Capillaroscopy</title>
    <style>
        /* Modern, Clean Research Design */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            color: #1a202c;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .research-card {
            background: #ffffff;
            max-width: 800px;
            width: 90%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: #ebf8ff;
            color: #3182ce;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.75rem;
            color: #2d3748;
            margin: 0 0 10px 0;
            line-height: 1.2;
        }

        p.author {
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .video-box {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            line-height: 0;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .info-footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
            font-size: 0.85rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="research-card">
        <span class="badge">Medical AI Research</span>
        <h1>AI in Capillaroscopy for Prediction of Preeclampsia</h1>
        <p class="author">By Zaynab Nakhuda</p>

        <div class="video-box">
            <video controls playsinline preload="auto">
                <source src="my_video_web.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="info-footer">
            &copy; 2026 Automated Video Annotation Framework
        </div>
    </div>

</body>
</html>
